[build-system]
# 0.11 is the first release with stable PEP 639 ("license" as SPDX
# expression) handling, which the [project] table below uses.
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "saltare"
version = "1.12.0"
description = "Low-RAM ASGI HTTP server with a Zig backbone."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ricardo Robles", email = "ricardo.r.f@hotmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.scripts]
saltare = "saltare.cli:main"

# Contributor environment (PEP 735). Distinct from the `dev` *extra* above,
# which exists for consumers running `pip install saltare[dev]`. This group
# is what plain `uv sync` installs, and it has to carry two things the extra
# deliberately does not:
#
#   - the build backend. `[build-system].requires` is NOT a project
#     dependency, so `uv sync` prunes scikit-build-core from the venv and
#     the next `uv pip install -e . --no-build-isolation` dies. Keep it here
#     or the Zig rebuild loop breaks after any sync.
#   - the test dependencies, so `uv sync && pytest` works. `uv sync` does
#     not install extras, so without this group a bare sync yields a venv
#     with no pytest at all.
[dependency-groups]
dev = [
    "scikit-build-core>=0.11",
    "ninja>=1.11",
    "pytest>=7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "websockets>=13",
    # The HTTP/2 wire-conformance tests need the real `h2` client. Without
    # it `tests/test_http2.py` skips wholesale at module level, silently
    # dropping the whole HTTP/2 suite.
    "h2>=4.1",
    # Backs the `@pytest.mark.flaky(reruns=N)` markers. Without it the
    # markers are unknown and the reruns silently become no-ops.
    "pytest-rerunfailures>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "websockets>=13",
    # v1.12: the HTTP/2 wire-conformance tests need the real `h2` client.
    # Without it `tests/test_http2.py` skips wholesale at module level, so
    # a plain `uv sync` silently loses the entire HTTP/2 suite.
    "h2>=4.1",
    # Backs the `@pytest.mark.flaky(reruns=N)` markers. Without it the
    # markers are unknown and the reruns silently become no-ops.
    "pytest-rerunfailures>=14",
]
# `pip install saltare[django]` pulls Django alongside saltare and
# unlocks the `saltare.contrib.django` integration: add
# `"saltare.contrib.django"` to INSTALLED_APPS and `manage.py runserver`
# runs the project under saltare (ASGI) instead of Django's bundled
# wsgiref dev server. Autoreload + staticfiles handling are preserved.
django = [
    "django>=4.2",
]

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/saltare"]
# Pyi stubs and the compiled _core extension live next to __init__.py in the wheel
wheel.exclude = ["**/*.zig", "**/*.zon"]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# v1.5: keep PyPy / win32 / i686 out, but ship musllinux too.
skip = ["pp*", "*-win32", "*_i686"]
build-verbosity = 1
test-requires = ["pytest", "httpx", "fastapi", "websockets", "pytest-rerunfailures", "h2"]
test-command = "pytest -q {project}/tests"

[tool.cibuildwheel.linux]
# NOTE: no OpenSSL package is needed here. tls.zig does not cimport
# <openssl/ssl.h> — it declares the types `opaque {}`, hard-codes the ABI
# constants it needs and resolves every entry point through a lazy
# dlopen+dlsym table — so the extension builds with no OpenSSL headers at
# all. TLS at *runtime* still needs libssl present on the host, but that
# is the user's system, not our build.
before-all = "bash {project}/scripts/install-zig.sh"
environment = { PATH = "/usr/local/bin:$PATH", ZIG_VERSION = "0.16.0" }
archs = ["x86_64", "aarch64"]
# Match the local Docker pipeline (scripts/build-wheel.sh + Dockerfile use
# manylinux_2_28). Also avoids the OpenSSL 1.0.2 in older manylinux2014
# images that some saltare TLS APIs may not match.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"

# v1.5: musllinux wheels for Alpine-based images (k8s sidecars,
# distroless containers). Alpine uses apk, so override the before-all on
# that selector. Tests still run against the same source tree.
[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "bash {project}/scripts/install-zig.sh"

# v1.13: macOS arm64 is a shipped platform (kqueue backend, validated
# on real hardware). Linux builds run in manylinux containers with Zig
# mounted in; macOS builds run runner-locally (no container backend),
# so before-all just ensures Zig is on PATH and archs pins arm64 —
# there is no Intel wheel. The extension links only libSystem;
# OpenSSL/brotli/zstd stay lazy dlopen at runtime (Homebrew absolute
# paths first), so no brew packages are needed at build time — but the
# *test* job does `brew install openssl@3 brotli zstd` for suite
# coverage. MACOSX_DEPLOYMENT_TARGET is intentionally unset here:
# cibuildwheel exports its default into the build env and
# CMakeLists.txt maps it to -Dtarget=<arch>-macos.<ver> (default 11.0)
# so the .so minos and the delocate tag cannot disagree.
[tool.cibuildwheel.macos]
before-all = "bash {project}/scripts/install-zig.sh"
archs = ["arm64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
