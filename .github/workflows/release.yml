name: Release wheels

# Tag-only. This is the *only* workflow that can reach PyPI.
#
# v1.12: the pipeline used to live entirely in this file, triggered on tag
# pushes, with `publish` gated on `startsWith(github.ref, 'refs/tags/v')`.
# That gate was correct but the job still showed up, greyed out as
# "skipped", on any branch run that included it — which is exactly the
# wrong signal to leave lying around next to a release. Publishing now
# lives in a workflow that a branch push cannot start at all.
#
# The build and test matrix is not repeated here; it is called from
# `build-and-test.yml`, shared with `ci.yml`. So:
#
#   push to main / pull request  ->  ci.yml      -> build + test, no publish
#   push tag vX.Y.Z              ->  release.yml -> build + test + publish
#
# Production targets: Linux x86_64 + aarch64 (manylinux and musllinux)
# and macOS arm64. No macOS x86_64 wheel (negligible demand; would need
# Rosetta or a separate Intel runner). See the note in pyproject.toml.
#
# manylinux_2_28 + musllinux_1_2 are PyPI compatibility tags, not just
# container choices — PyPI rejects wheels tagged `linux_x86_64` (the
# raw-Linux tag) because they're not portable across distros. So the
# build images here are fixed; performance work is in the matrix shape
# (parallelism) and the test-stage split, not the base image.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Serialise releases per ref, but **never cancel one**. This is the
# deliberate opposite of `ci.yml`, and the reason is that publishing to
# PyPI is not safely interruptible: a run cancelled between uploading some
# wheels and others leaves a partial release, and a release cannot be
# un-published. So a second run for the same tag queues behind the first
# instead of replacing it, and a new tag runs concurrently rather than
# waiting — `ci.yml` is in a different group, so a push to main cannot
# disturb a release either.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    # A called workflow, not a job: it is a single unit of work whose
    # internal jobs all have to pass. `needs: build-and-test` below is
    # what makes publish wait for all of them.
    uses: ./.github/workflows/build-and-test.yml

  # PyPI publish. Gated on tag pushes AND on the whole build-and-test
  # matrix passing — including test_macos, which runs inside the called
  # workflow. A release is not published with a red platform.
  #
  # v1.12: macOS arm64 is a release-gated platform again (it builds and
  # its suite runs on macos-14). No macOS x86_64 wheel is built, so
  # there is nothing Intel to gate on.
  #
  # The `if:` is redundant with this file's tag-only trigger. It is kept
  # anyway: it is the one line standing between a build and an upload, and
  # `workflow_dispatch` on any branch would otherwise be a way to publish
  # from an untagged ref.
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/saltare/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
