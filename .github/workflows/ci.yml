name: CI

# Push to main and pull requests: build the wheels and test them, and
# nothing else. There is no publish job in this file, and no way to reach
# one from here — see `release.yml`, which is tag-only.
#
# v1.12: the entire pipeline lived in `release.yml` behind a tag trigger, so
# a push to main ran *nothing*. That made "validate before you tag"
# impossible. v1.13: macOS arm64 builds and tests on macos-14 runners
# here too, so module.zig and server.zig are compiled for Darwin on a
# real Mac on every push — `make check-macos` remains the fast local
# pre-check for platform-only edits.
#
# The build + test matrix is called from `build-and-test.yml` rather than
# repeated, so `ci.yml` and `release.yml` cannot drift apart.

on:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - "build.zig"
      - "build.zig.zon"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

# Superseded runs are dead work: this pipeline fans out to four wheel builds
# and five test jobs, so a run left behind while you keep pushing costs
# minutes of runner time and tells you nothing. `github.ref` keeps the scope
# per-branch — a run for a pull request is `refs/pull/N/merge`, so pushing
# to a PR cancels that PR's previous run and nothing else. A *global* group
# would be wrong: it would let a push to main cancel an unrelated release.
#
# `release.yml` deliberately has its own group, below.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
