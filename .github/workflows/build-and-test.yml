name: Build & release wheels
# Reusable: build the wheels and test them, on every platform saltare ships.
#
# Called by `ci.yml` (push to main, and pull requests) and by `release.yml`
# (tag pushes), so the matrix is defined in exactly one place. There is no
# publish job here at all — publishing lives in `release.yml` and is
# reachable only from a tag, which is what makes it safe to run this on
# every push.
#
# `github` inside a called workflow is the *caller's* context, so `github.sha`,
# `github.ref` and `runner.*` below mean what they look like they mean.

on:
  workflow_call:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # ---------------------------------------------------------------------------
  # Wheels — 12-job fan-out: 4 Linux (libc × arch) × 3 Python shards (2+2+1).
  # The per-job build script already dominates the wall clock (152 s of the
  # 2.7 min job on manylinux x86_64, building 5 wheels sequentially), and
  # setup is 0-8 s because every cache hits — so there is nothing to win
  # anywhere except fewer wheels per job. Sharding 2+2+1 caps each job at
  # two wheels (~70-80 s) and moves the build stage from ~3.2 min to
  # ~1.3-1.5 min. This repo is public so the extra parallel jobs cost zero
  # runner minutes; the ceiling is GitHub's ~20-job concurrency cap, and
  # 12 build jobs + the sdist peak safely under it.
  build_wheels:
    name: wheels ${{ matrix.libc }} ${{ matrix.arch }} s${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    env:
      # Every directory the build reads or writes is declared here, once,
      # and referenced as `${{ env.NAME }}` everywhere else. v1.12 had
      # ZIG_DIR / ZIG_CACHE_DIR on the *build step* instead, and an edit
      # that rewrote that step's `command:` block dropped the `env:` that
      # defined them. Nothing complained: both references expanded to an
      # empty string, so cibuildwheel asked docker to mount
      # `:/host-zig:ro` and died with "invalid spec: :/host-zig:ro: empty
      # section between colons" — after burning three 30-minute retry
      # attempts on it. A path that is referenced but defined somewhere
      # fragile fails as a malformed mount rather than as a missing
      # variable, which is why it gets exactly one definition.
      #
      # `runner` is NOT in scope for a job-level `env`: the contexts
      # available there are github/needs/strategy/matrix/vars/secrets/inputs,
      # so `${{ runner.temp }}` here would make the workflow fail to parse
      # with zero jobs. `github.workspace` is valid, and a workspace
      # subdirectory is easier to reason about than runner temp.
      #
      # CIBW_CACHE_DIR points the *container's* pip cache at PIP_CACHE_DIR;
      # the Zig toolchain and the Zig build cache are bind-mounted into the
      # manylinux image the same way.
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
      ZIG_DIR: ${{ github.workspace }}/.zig-toolchain
      ZIG_CACHE_DIR: ${{ github.workspace }}/.zig-build-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2+2+1 per platform: each job builds at most two wheels, so the
          # critical path is bounded by two sequential Zig builds instead
          # of five. `pys` is a space-separated list because CIBW_BUILD
          # takes space-separated selectors — the build step joins it
          # there.
          - { os: ubuntu-latest,     arch: x86_64,  libc: manylinux, shard: 1, pys: "cp310 cp311" }
          - { os: ubuntu-latest,     arch: x86_64,  libc: manylinux, shard: 2, pys: "cp312 cp313" }
          - { os: ubuntu-latest,     arch: x86_64,  libc: manylinux, shard: 3, pys: "cp314" }
          - { os: ubuntu-latest,     arch: x86_64,  libc: musllinux, shard: 1, pys: "cp310 cp311" }
          - { os: ubuntu-latest,     arch: x86_64,  libc: musllinux, shard: 2, pys: "cp312 cp313" }
          - { os: ubuntu-latest,     arch: x86_64,  libc: musllinux, shard: 3, pys: "cp314" }
          - { os: ubuntu-24.04-arm,  arch: aarch64, libc: manylinux, shard: 1, pys: "cp310 cp311" }
          - { os: ubuntu-24.04-arm,  arch: aarch64, libc: manylinux, shard: 2, pys: "cp312 cp313" }
          - { os: ubuntu-24.04-arm,  arch: aarch64, libc: manylinux, shard: 3, pys: "cp314" }
          - { os: ubuntu-24.04-arm,  arch: aarch64, libc: musllinux, shard: 1, pys: "cp310 cp311" }
          - { os: ubuntu-24.04-arm,  arch: aarch64, libc: musllinux, shard: 2, pys: "cp312 cp313" }
          - { os: ubuntu-24.04-arm,  arch: aarch64, libc: musllinux, shard: 3, pys: "cp314" }
          # v1.12: macos-14 was dropped from this matrix. No macOS wheel is
          # built and no macOS job runs, so the platform is not gated on
          # anything. The kqueue backend stays in the tree and is still
          # cross-compile-checked by `make check-macos`; it gets validated
          # on real hardware in a later release.
    steps:
      - uses: actions/checkout@v4

      # cibuildwheel was invoked as `pipx run cibuildwheel==3.4.1`, which
      # builds a throwaway venv on every job — GitHub runners are ephemeral,
      # so that venv is paid for on all four jobs every run. Installing it
      # into the runner's Python is one pip resolve instead. The saving is
      # real but modest (single-digit seconds), unlike the other changes
      # here; pip's download cache is already warm from the step below.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: pip install cibuildwheel==3.4.1

      # Pre-install Zig on the runner (with caching) and mount it into
      # the cibuildwheel container. Avoids `ziglang.org` reachability
      # problems from inside the manylinux image — those caused
      # 4–10 min hangs in `before_all` previously.
      #
      # On macOS there is no container: cibuildwheel runs in a virtualenv on
      # the runner itself, so Zig has to be on the runner's PATH rather than
      # mounted. The same install script and the same cache key shape are
      # reused, with `libc` in the key so the two platforms never collide.
      - name: Cache Zig toolchain
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ZIG_DIR }}
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.libc }}-${{ matrix.arch }}-${{ runner.os }}

      - name: Install Zig on runner
        if: steps.zig-cache.outputs.cache-hit != 'true'
        env:
          ZIG_INSTALL_DIR: ${{ env.ZIG_DIR }}
          ZIG_SKIP_SYMLINK: "1"
        run: bash scripts/install-zig.sh

      # v1.12: the key ended in `${{ github.sha }}`, so the primary key
      # could never hit — every run fell through to restore-keys and then
      # uploaded a fresh copy of a few hundred MB. Pointless churn, because
      # Zig's global cache is *content-addressed*: entries are keyed by the
      # hash of the source and the build options, not by commit. Reusing one
      # cache across commits is therefore correct by construction, and a
      # stale entry is never returned — an unchanged file hits, a changed
      # one misses. So the key is deliberately stable: saved once per
      # (arch, libc, Zig version) and restored forever after.
      #
      # The wheelhouse cache below is a different case and keeps the sha —
      # see the comment there for why a *wheel* must never cross commits.
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.ZIG_CACHE_DIR }}
          key: zig-build-${{ matrix.arch }}-${{ matrix.libc }}-${{ env.ZIG_VERSION }}

      # Tier-5: cache pip's download/wheel cache across runs so the
      # build-time dependency install (`scikit-build-core`, `cmake`,
      # `ninja`) skips the PyPI round-trip on cache hits.
      #
      # v1.12: this used to point at ~/.cache/pip, the *runner's* pip cache.
      # cibuildwheel builds Linux wheels inside a container, so nothing ever
      # read it. The path is now the runner-temp dir that CIBW_CACHE_DIR (and
      # PIP_CACHE_DIR on macOS, which has no container) actually points at, so
      # the saving the comment claims is finally real.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ matrix.arch }}-${{ matrix.libc }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.arch }}-${{ matrix.libc }}-

      # Re-running a failed workflow rebuilt all 25 wheels from scratch. The
      # wheelhouse is keyed on the exact commit, so a re-run of the *same*
      # commit restores whatever already built and cibuildwheel skips those,
      # leaving only the ones that failed. Keyed on sha, not a branch prefix,
      # so a wheel is never reused across different source. The path is the
      # workspace-relative `wheelhouse` that `--output-dir` writes, not
      # runner.temp. The shard is in the key because three shards of the
      # same (arch, libc) restore and write the same directory — without it
      # they would clobber one another's caches.
      - name: Cache built wheels
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/wheelhouse
          key: wheelhouse-${{ matrix.arch }}-${{ matrix.libc }}-s${{ matrix.shard }}-${{ github.sha }}


      # Tier-3: skip cibuildwheel's per-wheel test pass entirely. Tests
      # run once in the separate `test_wheels` job below.
      # v1.12: was wrapped in nick-fields/retry@v3 (timeout_minutes=30,
      # max_attempts=3). Two costs, both observed. A *deterministic*
      # failure was rediscovered three times — the docker mount bug spent
      # three attempts learning the same thing — and a genuine hang held the
      # runner for up to 90 minutes. A plain step with an explicit bound
      # beats both: failures surface in seconds, and timeout-minutes still
      # caps a hang, once instead of three times. Unsharded jobs measured
      # 2.7-3.3 min for five wheels; a two-wheel shard should be ~70-80 s,
      # so 45 is still generous headroom for aarch64/musllinux.
      - name: Build wheels
        timeout-minutes: 45
        run: |
          # v1.12: the macOS branch of this script is gone along with the
          # macos-14 matrix entry — nothing selects `libc = macos` any
          # more, so the if/else had one arm. CIBW_CACHE_DIR points the
          # container's pip cache at this host directory; it used to be
          # unset, and the "Cache pip downloads" step was caching
          # ~/.cache/pip, which the container never reads, so the saving
          # that step's comment promised was not actually happening.
          export CIBW_CACHE_DIR="${{ env.PIP_CACHE_DIR }}"
          export PIP_CACHE_DIR="${{ env.PIP_CACHE_DIR }}"
          mkdir -p "$CIBW_CACHE_DIR" "${{ env.ZIG_CACHE_DIR }}"
          chmod -R 777 "${{ env.ZIG_CACHE_DIR }}"

          # cibuildwheel builds all matched identifiers in a single
          # container, so a two-wheel shard keeps today's per-container
          # amortisation: one container, two venvs.
          export CIBW_ARCHS="${{ matrix.arch }}"
          # `matrix.pys` is a space-separated list ("cp310 cp311"); join it
          # into a space-separated CIBW_BUILD ("cp310-manylinux_*
          # cp311-manylinux_*"). Per the cibuildwheel docs, selectors are
          # fnmatch globs and multiple selectors are separated by a space
          # — which is also why the old `cp31?-*` pattern worked (`?` is
          # fnmatch for one char), and why `|` is invalid there.
          export CIBW_BUILD=""
          for p in ${{ matrix.pys }}; do
            CIBW_BUILD="${CIBW_BUILD:+$CIBW_BUILD }${p}-${{ matrix.libc }}_*"
          done
          export CIBW_TEST_SKIP="*"

          export CIBW_REPAIR_WHEEL_COMMAND_LINUX="auditwheel repair -w {dest_dir} {wheel}"

          export CIBW_CONTAINER_ENGINE="docker; create_args: --volume ${{ env.ZIG_DIR }}:/host-zig:ro --volume ${{ env.ZIG_CACHE_DIR }}:/zig-cache:rw --volume $CIBW_CACHE_DIR:/pip-cache:rw"
          export CIBW_ENVIRONMENT_LINUX="PATH=/host-zig:/usr/local/bin:\$PATH ZIG_VERSION=${{ env.ZIG_VERSION }} ZIG_GLOBAL_CACHE_DIR=/zig-cache PIP_CACHE_DIR=/pip-cache PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_WARN_SCRIPT_LOCATION=0 PIP_NO_BUILD_ISOLATION=0"

          cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          # One artifact per shard: three shards of the same (arch, libc)
          # each upload, and the test jobs glob them back with
          # `pattern: wheels-...-s*`. `release.yml` merges *all* of them
          # into `dist` with merge-multiple, so publishing needs no change.
          name: wheels-${{ matrix.arch }}-${{ matrix.libc }}-s${{ matrix.shard }}
          path: ./wheelhouse/*.whl

  # ---------------------------------------------------------------------------
  # Tier-3 test stage. Downloads the manylinux x86_64 wheel set built
  # above and runs `pytest -q tests` against cp310 / cp312 / cp314 in a
  # lightweight ubuntu-latest runner — no manylinux container needed for
  # the test phase. Catches version-specific issues without re-paying
  # the cibuildwheel per-wheel install tax × 5 Python versions × 12
  # (libc, arch, shard) jobs.
  test_wheels:
    name: test cp${{ matrix.py_short }}
    needs: build_wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # v1.12: all five built versions are tested. The build fans out
          # over cp310-cp314 (`CIBW_BUILD="cp31?-*"`), so testing three of
          # them meant cp311 and cp313 were *published without ever being
          # run against* — and this suite has a track record of paths that
          # only break on one interpreter. Two more jobs is a cheap price
          # for not shipping untested wheels.
          - { python-version: "3.10", py_short: "310" }
          - { python-version: "3.11", py_short: "311" }
          - { python-version: "3.12", py_short: "312" }
          - { python-version: "3.13", py_short: "313" }
          - { python-version: "3.14", py_short: "314" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # One artifact per build shard (see build_wheels above); glob all
      # three shards of the tested platform and merge them into one dir.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-x86_64-manylinux-s*
          merge-multiple: true
          path: wheelhouse

      - name: Cache pip downloads (test)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-test-${{ matrix.python-version }}-

      - name: Install wheel + test deps
        run: |
          pip install --upgrade pip
          # Match the test-requires baked into pyproject.toml's
          # [tool.cibuildwheel]; keeps both runs honest.
          # v1.12: `h2` was missing here while being present in
          # cibuildwheel's test-requires. `tests/test_http2.py` skips
          # itself at module level via importorskip("h2.connection"), so
          # the omission did not fail the job — it just quietly dropped
          # the entire HTTP/2 wire-conformance suite, including the
          # flow-control tests. If you change this list, change
          # pyproject.toml's test-requires in the same commit.
          pip install pytest httpx fastapi websockets pytest-rerunfailures h2
          # Pick the wheel matching this runner's CPython tag.
          pip install --no-deps wheelhouse/saltare-*-cp${{ matrix.py_short }}-cp${{ matrix.py_short }}*-manylinux_2_28_x86_64.whl

      - name: Run pytest
        run: pytest -q tests

  # v1.12: the `test_macos` job is gone. It was the gate for the kqueue
  # port, and it did its job — it caught the phantom `_sendfile_darwin`
  # symbol that no amount of Linux testing or cross-compiling could see.
  # But it also cannot be made green on a hosted runner: the suite aborts
  # there, and no macOS wheel is published, so there is nothing to gate a
  # release on. The Darwin code stays in the tree and stays
  # cross-compile-checked by `make check-macos`; validating it on real
  # hardware is the next release's job, with a Mac.

  # ---------------------------------------------------------------------------
  # aarch64 test stage. The wheels above were built but — like cp311/cp313
  # before them — never *run against*: every test job consumed only
  # x86_64-manylinux, so all aarch64 and musllinux wheels shipped
  # untested. This job runs the same suite against all five aarch64
  # manylinux wheels on the native ARM runner, in parallel with the x86_64
  # tests above, so it adds zero wall clock. Expect it to find failures
  # the first time it runs — nothing has ever executed this suite on
  # native ARM, and that signal is the whole point. musllinux stays
  # untested in CI (no Alpine runner; covered locally by
  # `make smoke-alpine`).
  test_wheels_arm:
    name: test arm64 cp${{ matrix.py_short }}
    needs: build_wheels
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", py_short: "310" }
          - { python-version: "3.11", py_short: "311" }
          - { python-version: "3.12", py_short: "312" }
          - { python-version: "3.13", py_short: "313" }
          - { python-version: "3.14", py_short: "314" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-aarch64-manylinux-s*
          merge-multiple: true
          path: wheelhouse

      - name: Cache pip downloads (test arm64)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-arm64-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-test-arm64-${{ matrix.python-version }}-

      - name: Install wheel + test deps
        run: |
          pip install --upgrade pip
          # Same list as the x86_64 test job and pyproject.toml's
          # test-requires — the three must move together.
          pip install pytest httpx fastapi websockets pytest-rerunfailures h2
          pip install --no-deps wheelhouse/saltare-*-cp${{ matrix.py_short }}-cp${{ matrix.py_short }}*-manylinux_2_28_aarch64.whl

      - name: Run pytest
        run: pytest -q tests

  # ---------------------------------------------------------------------------
  # Source distribution. Independent of the wheel matrix — runs once on
  # ubuntu-latest, no manylinux needed (sdists are platform-agnostic).
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
