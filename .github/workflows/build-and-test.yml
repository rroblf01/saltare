name: Build & release wheels
# Reusable: build the wheels and test them, on every platform saltare ships.
#
# Called by `ci.yml` (push to main, and pull requests) and by `release.yml`
# (tag pushes), so the matrix is defined in exactly one place. There is no
# publish job here at all — publishing lives in `release.yml` and is
# reachable only from a tag, which is what makes it safe to run this on
# every push.
#
# `github` inside a called workflow is the *caller's* context, so `github.sha`,
# `github.ref` and `runner.*` below mean what they look like they mean.

on:
  workflow_call:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # ---------------------------------------------------------------------------
  # Wheels — 5-job fan-out: 4 Linux (libc × arch) + 1 macOS arm64.
  # Each job builds the 5 supported Python versions (cp310 .. cp314) for
  # its one (libc, arch) combo.
  # GitHub free-tier concurrency caps at ~20 parallel jobs; 5 is safely
  # under that and runs in parallel with build_sdist + test_wheels.
  build_wheels:
    name: wheels ${{ matrix.libc }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      # Every directory the build reads or writes is declared here, once,
      # and referenced as `${{ env.NAME }}` everywhere else. v1.12 had
      # ZIG_DIR / ZIG_CACHE_DIR on the *build step* instead, and an edit
      # that rewrote that step's `command:` block dropped the `env:` that
      # defined them. Nothing complained: both references expanded to an
      # empty string, so cibuildwheel asked docker to mount
      # `:/host-zig:ro` and died with "invalid spec: :/host-zig:ro: empty
      # section between colons" — after burning three 30-minute retry
      # attempts on it. A path that is referenced but defined somewhere
      # fragile fails as a malformed mount rather than as a missing
      # variable, which is why it gets exactly one definition.
      #
      # `runner` is NOT in scope for a job-level `env`: the contexts
      # available there are github/needs/strategy/matrix/vars/secrets/inputs,
      # so `${{ runner.temp }}` here would make the workflow fail to parse
      # with zero jobs. `github.workspace` is valid, and a workspace
      # subdirectory is easier to reason about than runner temp.
      #
      # CIBW_CACHE_DIR points the *container's* pip cache at PIP_CACHE_DIR;
      # the Zig toolchain and the Zig build cache are bind-mounted into the
      # manylinux image the same way.
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
      ZIG_DIR: ${{ github.workspace }}/.zig-toolchain
      ZIG_CACHE_DIR: ${{ github.workspace }}/.zig-build-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     arch: x86_64,  libc: manylinux }
          - { os: ubuntu-latest,     arch: x86_64,  libc: musllinux }
          - { os: ubuntu-24.04-arm,  arch: aarch64, libc: manylinux }
          - { os: ubuntu-24.04-arm,  arch: aarch64, libc: musllinux }
          # v1.12: macos-14 was dropped from this matrix. No macOS wheel is
          # built and no macOS job runs, so the platform is not gated on
          # anything. The kqueue backend stays in the tree and is still
          # cross-compile-checked by `make check-macos`; it gets validated
          # on real hardware in a later release.
    steps:
      - uses: actions/checkout@v4

      # Pre-install Zig on the runner (with caching) and mount it into
      # the cibuildwheel container. Avoids `ziglang.org` reachability
      # problems from inside the manylinux image — those caused
      # 4–10 min hangs in `before_all` previously.
      #
      # On macOS there is no container: cibuildwheel runs in a virtualenv on
      # the runner itself, so Zig has to be on the runner's PATH rather than
      # mounted. The same install script and the same cache key shape are
      # reused, with `libc` in the key so the two platforms never collide.
      - name: Cache Zig toolchain
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ZIG_DIR }}
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.libc }}-${{ matrix.arch }}-${{ runner.os }}

      - name: Install Zig on runner
        if: steps.zig-cache.outputs.cache-hit != 'true'
        env:
          ZIG_INSTALL_DIR: ${{ env.ZIG_DIR }}
          ZIG_SKIP_SYMLINK: "1"
        run: bash scripts/install-zig.sh

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.ZIG_CACHE_DIR }}
          key: zig-build-${{ matrix.arch }}-${{ matrix.libc }}-${{ github.sha }}
          restore-keys: |
            zig-build-${{ matrix.arch }}-${{ matrix.libc }}-

      # Tier-5: cache pip's download/wheel cache across runs so the
      # build-time dependency install (`scikit-build-core`, `cmake`,
      # `ninja`) skips the PyPI round-trip on cache hits.
      #
      # v1.12: this used to point at ~/.cache/pip, the *runner's* pip cache.
      # cibuildwheel builds Linux wheels inside a container, so nothing ever
      # read it. The path is now the runner-temp dir that CIBW_CACHE_DIR (and
      # PIP_CACHE_DIR on macOS, which has no container) actually points at, so
      # the saving the comment claims is finally real.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ matrix.arch }}-${{ matrix.libc }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.arch }}-${{ matrix.libc }}-

      # Re-running a failed workflow rebuilt all 25 wheels from scratch. The
      # wheelhouse is keyed on the exact commit, so a re-run of the *same*
      # commit restores whatever already built and cibuildwheel skips those,
      # leaving only the ones that failed. Keyed on sha, not a branch prefix,
      # so a wheel is never reused across different source. The path is the
      # workspace-relative `wheelhouse` that `--output-dir` writes, not
      # runner.temp.
      - name: Cache built wheels
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/wheelhouse
          key: wheelhouse-${{ matrix.arch }}-${{ matrix.libc }}-${{ github.sha }}


      # Tier-3: skip cibuildwheel's per-wheel test pass entirely. Tests
      # run once in the separate `test_wheels` job below.
      - name: Build wheels
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            # v1.12: the macOS branch of this script is gone along with the
            # macos-14 matrix entry — nothing selects `libc = macos` any
            # more, so the if/else had one arm. CIBW_CACHE_DIR points the
            # container's pip cache at this host directory; it used to be
            # unset, and the "Cache pip downloads" step was caching
            # ~/.cache/pip, which the container never reads, so the saving
            # that step's comment promised was not actually happening.
            export CIBW_CACHE_DIR="${{ env.PIP_CACHE_DIR }}"
            export PIP_CACHE_DIR="${{ env.PIP_CACHE_DIR }}"
            mkdir -p "$CIBW_CACHE_DIR" "${{ env.ZIG_CACHE_DIR }}"
            chmod -R 777 "${{ env.ZIG_CACHE_DIR }}"

            export CIBW_ARCHS="${{ matrix.arch }}"
            export CIBW_BUILD="cp31?-${{ matrix.libc }}_*"
            export CIBW_TEST_SKIP="*"

            export CIBW_REPAIR_WHEEL_COMMAND_LINUX="auditwheel repair -w {dest_dir} {wheel}"

            export CIBW_CONTAINER_ENGINE="docker; create_args: --volume ${{ env.ZIG_DIR }}:/host-zig:ro --volume ${{ env.ZIG_CACHE_DIR }}:/zig-cache:rw --volume $CIBW_CACHE_DIR:/pip-cache:rw"
            export CIBW_ENVIRONMENT_LINUX="PATH=/host-zig:/usr/local/bin:\$PATH ZIG_VERSION=${{ env.ZIG_VERSION }} ZIG_GLOBAL_CACHE_DIR=/zig-cache PIP_CACHE_DIR=/pip-cache PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_WARN_SCRIPT_LOCATION=0 PIP_NO_BUILD_ISOLATION=0"

            pipx run cibuildwheel==3.4.1 --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}-${{ matrix.libc }}
          path: ./wheelhouse/*.whl

  # ---------------------------------------------------------------------------
  # Tier-3 test stage. Downloads the manylinux x86_64 wheel set built
  # above and runs `pytest -q tests` against cp310 / cp312 / cp314 in a
  # lightweight ubuntu-latest runner — no manylinux container needed for
  # the test phase. Catches version-specific issues without re-paying
  # the cibuildwheel per-wheel install tax × 5 Python versions × 4
  # (libc, arch) jobs.
  test_wheels:
    name: test cp${{ matrix.py_short }}
    needs: build_wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", py_short: "310" }
          - { python-version: "3.12", py_short: "312" }
          - { python-version: "3.14", py_short: "314" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: wheels-x86_64-manylinux
          path: wheelhouse

      - name: Cache pip downloads (test)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-test-${{ matrix.python-version }}-

      - name: Install wheel + test deps
        run: |
          pip install --upgrade pip
          # Match the test-requires baked into pyproject.toml's
          # [tool.cibuildwheel]; keeps both runs honest.
          # v1.12: `h2` was missing here while being present in
          # cibuildwheel's test-requires. `tests/test_http2.py` skips
          # itself at module level via importorskip("h2.connection"), so
          # the omission did not fail the job — it just quietly dropped
          # the entire HTTP/2 wire-conformance suite, including the
          # flow-control tests. If you change this list, change
          # pyproject.toml's test-requires in the same commit.
          pip install pytest httpx fastapi websockets pytest-rerunfailures h2
          # Pick the wheel matching this runner's CPython tag.
          pip install --no-deps wheelhouse/saltare-*-cp${{ matrix.py_short }}-cp${{ matrix.py_short }}*-manylinux_2_28_x86_64.whl

      - name: Run pytest
        run: pytest -q tests

  # v1.12: the `test_macos` job is gone. It was the gate for the kqueue
  # port, and it did its job — it caught the phantom `_sendfile_darwin`
  # symbol that no amount of Linux testing or cross-compiling could see.
  # But it also cannot be made green on a hosted runner: the suite aborts
  # there, and no macOS wheel is published, so there is nothing to gate a
  # release on. The Darwin code stays in the tree and stays
  # cross-compile-checked by `make check-macos`; validating it on real
  # hardware is the next release's job, with a Mac.

  # ---------------------------------------------------------------------------
  # Source distribution. Independent of the wheel matrix — runs once on
  # ubuntu-latest, no manylinux needed (sdists are platform-agnostic).
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
